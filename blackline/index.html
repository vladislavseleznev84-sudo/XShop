<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>BLACKLINE — барбершоп. Стрижки, фейды, борода, запись онлайн</title>
    <meta
      name="description"
      content="BLACKLINE — независимый барбершоп: классические стрижки, skin fade, оформление бороды. Три мастера, запись онлайн. Демонстрационный проект."
    />
    <meta name="theme-color" content="#101010" />
    <meta name="color-scheme" content="dark" />
    <link rel="canonical" href="https://blackline.example/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:site_name" content="BLACKLINE" />
    <meta property="og:title" content="BLACKLINE — барбершоп" />
    <meta property="og:description" content="Одна точная линия. Три мастера, запись онлайн." />
    <meta property="og:url" content="https://blackline.example/" />
    <meta property="og:image" content="https://blackline.example/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" href="./fonts/noto-serif-display-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/noto-serif-display-cyrillic-wdth-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="./fonts/onest-cyrillic-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <link
      rel="preload"
      as="image"
      type="image/avif"
      imagesrcset="./img/hero-480.avif 480w, ./img/hero-800.avif 800w, ./img/hero-1280.avif 1280w, ./img/hero-1920.avif 1920w"
      imagesizes="(max-width: 760px) 100vw, 34vw"
      fetchpriority="high"
    />

    <script>document.documentElement.classList.add('js');</script>

    <!-- Структурированные данные. ДЕМО: адрес и телефон вымышлены. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "BLACKLINE",
        "description": "Независимый барбершоп: стрижки, skin fade, оформление бороды.",
        "url": "https://blackline.example/",
        "image": "https://blackline.example/og.jpg",
        "telephone": "+7 495 000-00-00",
        "priceRange": "1200–2700 RUB",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Демонстрационный пер., 7, стр. 2",
          "addressLocality": "Москва",
          "addressCountry": "RU"
        },
        "openingHoursSpecification": [
          { "@type": "OpeningHoursSpecification", "dayOfWeek": ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"], "opens": "10:00", "closes": "21:00" },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "11:00", "closes": "19:00" }
        ],
        "makesOffer": [
          { "@type": "Offer", "price": "1800", "priceCurrency": "RUB", "itemOffered": { "@type": "Service", "name": "Classic Haircut" } },
          { "@type": "Offer", "price": "2000", "priceCurrency": "RUB", "itemOffered": { "@type": "Service", "name": "Skin Fade" } },
          { "@type": "Offer", "price": "1200", "priceCurrency": "RUB", "itemOffered": { "@type": "Service", "name": "Beard Design" } },
          { "@type": "Offer", "price": "2700", "priceCurrency": "RUB", "itemOffered": { "@type": "Service", "name": "Haircut + Beard" } }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
